<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nombre del Negocio | Menú Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
    <div class="header-contenido">
        <img src="assets/images/logo/logo.png" alt="Logo La Hueca del Veci" class="header-logo">
        <h1 class="header-titulo">La Hueca del Veci</h1>
        <p class="header-subtitulo">Comida rápida con sabor de barrio</p>
    </div>
</header>
<section class="banner">
    <div class="banner-contenido">
        <span class="banner-decoracion">★ ★ ★</span>
        <h2 class="banner-titulo">¡Antojos que sí llegan!</h2>
        <p class="banner-texto">Sabor de barrio, directo a tu mesa</p>
        <a href="#categorias" class="banner-boton">Ver el menú</a>
    </div>
</section>
<section id="categorias" class="seccion-menu">
    <nav class="categorias-nav">
        <button class="categoria-btn categoria-activa" data-categoria="todos">Todos</button>
        <button class="categoria-btn" data-categoria="hamburguesas">Hamburguesas</button>
        <button class="categoria-btn" data-categoria="salchipapas">Salchipapas</button>
        <button class="categoria-btn" data-categoria="hotdogs">Hot Dogs</button>
        <button class="categoria-btn" data-categoria="papas">Papas Fritas</button>
        <button class="categoria-btn" data-categoria="bebidas">Bebidas</button>
        <button class="categoria-btn" data-categoria="combos">Combos</button>
    </nav>

    <div class="productos-contenedor">
    <article class="producto-card" data-categoria="hamburguesas">
        <img src="assets/images/productos/hamburguesa-clasica.jpg" alt="Hamburguesa Clásica" class="producto-imagen">
        <div class="producto-info">
            <h3 class="producto-nombre">Hamburguesa Clásica</h3>
            <p class="producto-descripcion">Carne 100% de res, queso cheddar, lechuga, tomate y salsa especial de la casa</p>
            <span class="producto-precio">$5.50</span>
        </div>
    </article>
</div>
    </div>
</section>

    <script src="js/script.js"></script>
</body>
</html>
